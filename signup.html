
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IronPeak | Sign Up</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/signup.css">
</head>

<body>

    <!-- Background Animation -->
    <div class="background-animation">
        <span class="glow glow-one"></span>
        <span class="glow glow-two"></span>
        <span class="glow glow-three"></span>
        <span class="circle circle-one"></span>
        <span class="circle circle-two"></span>
    </div>

    <main class="signup-section">

        <div class="signup-container" data-aos="zoom-in">

            <!-- Logo -->
            <a href="index.html" class="logo">
    <img src="assets/logo img1.webp" alt="IronPeak Logo">

      <small>Fitness Coaching</small>
    </a>
            <!-- Heading -->
            <div class="signup-heading" data-aos="fade-up" data-aos-delay="200">
                <span class="eyebrow">START YOUR JOURNEY</span>
                <h1>Create <span>Account</span></h1>
                <p>Join IronPeak and build your stronger future.</p>
            </div>

            <!-- Signup Form -->
            <form id="signupForm" novalidate>

                <!-- Full Name -->
                <div class="form-group" data-aos="fade-right" data-aos-delay="300">
                    <label for="fullname">Full Name</label>

                    <div class="input-box">
                        <i class="bi bi-person"></i>
                        <input type="text"
                            id="fullname"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required>
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group" data-aos="fade-left" data-aos-delay="350">
                    <label for="email">Gmail Address</label>

                    <div class="input-box">
                        <i class="bi bi-envelope"></i>
                        <input type="email"
                            id="email"
                            placeholder="Enter your Gmail"
                            autocomplete="email"
                            required>
                    </div>
                </div>

                <!-- Role Selection -->
                <div class="form-group role-group" data-aos="fade-up" data-aos-delay="400">

                    <label>Select Your Role</label>

                    <div class="role-options">

                        <label class="role-card">
                            <input type="radio" name="role" value="student" required>

                            <span class="role-content">
                                <i class="bi bi-person-workspace"></i>
                                <strong>Student</strong>
                            </span>
                        </label>

                        <label class="role-card">
                            <input type="radio" name="role" value="admin">

                            <span class="role-content">
                                <i class="bi bi-shield-lock"></i>
                                <strong>Admin</strong>
                            </span>
                        </label>

                    </div>
                </div>

                <!-- Password -->
                <div class="form-group" data-aos="fade-right" data-aos-delay="450">
                    <label for="password">Password</label>

                    <div class="input-box password-box">
                        <i class="bi bi-lock"></i>

                        <input type="password"
                            id="password"
                            placeholder="Create password"
                            autocomplete="new-password"
                            required>

                        <button type="button" class="toggle-password" data-target="password" aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group" data-aos="fade-left" data-aos-delay="500">
                    <label for="confirmPassword">Confirm Password</label>

                    <div class="input-box password-box">
                        <i class="bi bi-lock-fill"></i>

                        <input type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required>

                        <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Terms -->
                <div class="terms" data-aos="fade-up" data-aos-delay="550">
                    <label>
                        <input type="checkbox" id="terms">
                        <span>I agree to the Terms & Conditions</span>
                    </label>
                </div>

                <!-- Message -->
                <p id="signupMessage" class="signup-message" aria-live="polite"></p>

                <!-- Signup Button -->
                <button type="submit" class="signup-btn" data-aos="fade-up" data-aos-delay="600">
                    Create Account
                    <i class="bi bi-arrow-right"></i>
                </button>

            </form>

            <!-- Login Link -->
            <p class="login-link" data-aos="fade-up" data-aos-delay="650">
                Already have an account?
                <a href="login.html">Login Now</a>
            </p>

            <!-- Store Icons -->
            <div class="store-section" data-aos="fade-up" data-aos-delay="700">

                <p>Download Our App</p>

                <div class="store-icons">
                    <a href="#" aria-label="Google Play Store">
                        <i class="bi bi-google-play"></i>
                        <span>Google Play</span>
                    </a>

                    <a href="#" aria-label="Apple App Store">
                        <i class="bi bi-apple"></i>
                        <span>App Store</span>
                    </a>
                </div>

            </div>

        </div>

    </main>

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <!-- Custom JS -->
    <script src="js/signup.js"></script>

</body>
</html>
