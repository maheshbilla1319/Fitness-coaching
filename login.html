
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | IronPeak Fitness Coaching</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">

    <!-- Login CSS -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card" data-aos="zoom-in" data-aos-duration="900">

            <!-- Login Icon -->
            <div class="login-icon">
                <i class="bi bi-person-lock"></i>
            </div>

            <p class="eyebrow">WELCOME BACK</p>

            <h1>LOGIN TO <span>STACKLY</span></h1>

            <p class="description">
                Sign in to continue your fitness journey.
            </p>

            <form id="loginForm" novalidate>

                <!-- Role -->
                <div class="form-group">
                    <label for="role">Select Your Role</label>

                    <div class="input-box">
                        <i class="bi bi-person-badge"></i>

                        <select id="role" required>
                            <option value="">Choose your role</option>
                            <option value="student">Student</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <small class="error" id="roleError"></small>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <div class="input-box">
                        <i class="bi bi-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <small class="error" id="emailError"></small>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="input-box">
                        <i class="bi bi-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>

                    <small class="error" id="passwordError"></small>
                </div>

                <!-- Remember and Forgot -->
                <div class="form-options">

                    <label class="remember">
                        <input type="checkbox" id="remember">
                        <span>Remember me</span>
                    </label>

                    <a href="404.html" class="forgot-link">
                        Forgot Password?
                    </a>

                </div>

                <!-- Form Message -->
                <p class="form-message" id="formMessage" aria-live="polite"></p>

                <!-- Login Button -->
                <button type="submit" class="login-btn" id="loginButton">
                    LOGIN NOW
                    <i class="bi bi-arrow-right"></i>
                </button>

                <!-- Sign Up Button -->
                <a href="signup.html" class="signin-btn">
                    <i class="bi bi-person-plus"></i>
                    SIGN UP NOW
                </a>

            </form>

            <!-- Footer -->
            <div class="login-footer">

                <p>Train hard. Stay strong. Be unstoppable.</p>

                <span>
                    © <span id="year"></span> IronPeak Fitness Coaching
                </span>

            </div>

        </section>

    </main>

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <!-- Login JS -->
    <script src="js/login.js"></script>

</body>
</html>
